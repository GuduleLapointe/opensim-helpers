; helpers.ini: the config of the helpers for a grid. Copy it as
; /etc/opensim/grids/<grid>/helpers.ini (the folder of the grid, where its Robust config is when the OpenSim kit
; made it) and edit it.
;
; The web server user must be able to read it (mode 640, group www-data): it holds the password of the database.
; With several grids on the machine, the web server gives the nick of the one to serve in OPENSIM_GRID.
; A key left out takes the default of includes/bootstrap.php. Only the database is required.
;
; This is the recommended config. The historic one, constants in includes/config.php (see config.example.php),
; is used instead when that file exists.

[Helpers]
grid_name = "Your Grid"
login_uri = "http://yourgrid.org:8002"
; The public address of the web site, the links the helpers give start with it
web_url = "https://yourgrid.org"
; Where the helpers are on the web site (default /helpers)
; path = "/helpers"
; mail_sender = "no-reply@yourgrid.org"
; events_url = "https://2do.directory/events"
; motd = "Welcome to Your Grid, <USERNAME>!"
; grid_logo_url = "https://yourgrid.org/logo.png"
; use_utc_time = true
; currency_provider = "gloebit"
; currency_use_moneyserver = false
; currency_script_key = "123456789"
; currency_rate = 4
; currency_rate_per = 1000
; currency_helper_url = "https://yourgrid.org/helpers/currency.php"

; The main database, the one of Robust. Not needed when the Robust config of the grid is in the folder, it gives it.
[robust_db]
hostname = "localhost"
prefix = "robust"
user = "opensim"
password = "password"

; Another database for a service, with hostname, prefix (the name of the database), user and password each.
; What is left out is the one of Robust.
; [search_db]
; [currency_db]
; [offline_db]
; [opensim_db]

; The public path of a service when it is not <path>/<script>.php
; [Urls]
; search = "/search"
; guide = "/guide"
; welcome = "/welcome"
